pid /tmp/nginx.pid;
worker_processes auto;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # The host reverse proxy connects from the Docker bridge gateway and passes
  # the visitor address in X-Forwarded-For. Trust only that gateway.
  set_real_ip_from 172.23.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 16m;
  client_body_timeout 15s;
  keepalive_timeout 30s;
  limit_req_status 429;
  limit_req_zone $binary_remote_addr zone=general_api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth_api:10m rate=10r/m;

  map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
  }

  server {
    listen 8080;
    error_page 413 = @payload_too_large;

    location @payload_too_large {
      default_type application/json;
      add_header Cache-Control no-store always;
      return 413 '{"error":"Запрос слишком большой. Сократите комментарий и попробуйте ещё раз."}';
    }

    location = /api/admin/print-files {
      client_max_body_size 100m;
      limit_req zone=general_api burst=10 nodelay;
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 90s;
    }

    location = /api/admin/print/start {
      client_max_body_size 1m;
      limit_req zone=general_api burst=10 nodelay;
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 90s;
    }

    location = /api/checkout {
      client_max_body_size 64k;
      limit_req zone=general_api burst=40 nodelay;
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    location /api/ {
      client_max_body_size 1m;
      limit_req zone=general_api burst=40 nodelay;
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    location = /api/auth/login {
      client_max_body_size 1m;
      limit_req zone=auth_api burst=5 nodelay;
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    location = /api/admin/upload {
      client_max_body_size 16m;
      limit_req zone=general_api burst=10 nodelay;
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }
  }
}
