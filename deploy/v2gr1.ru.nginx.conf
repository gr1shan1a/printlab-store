server {
    server_name v2gr1.ru;
    client_max_body_size 16m;
    location / {
        proxy_pass http://127.0.0.1:32741;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/v2gr1.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/v2gr1.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    listen 80;
    listen [::]:80;
    server_name v2gr1.ru;
    return 301 https://v2gr1.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.v2gr1.ru;

    ssl_certificate /etc/letsencrypt/live/v2gr1.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v2gr1.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://v2gr1.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.v2gr1.ru;

    return 301 https://v2gr1.ru$request_uri;




}
